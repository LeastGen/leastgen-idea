# ==============================================================================
# Production Nginx Reverse Proxy Configuration
# LeastGen Labs (port 8756) & LeastGen Labs (port 8757 / 8756)
# Target: Alibaba Cloud ECS (Ubuntu 22.04 LTS / Debian 12)
# ==============================================================================

# Map Connection header for WebSocket upgrades
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── Rate Limiting Zones ───────────────────────────────────────────────────────
# Protect against DDoS, brute force, and runaway LLM invocation costs
limit_req_zone $binary_remote_addr zone=api_general_limit:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=api_auth_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_billing_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_pipeline_limit:10m rate=2r/m;
limit_req_status 429;

# ── Upstream Service Definitions ──────────────────────────────────────────────
# LeastGen Labs Backend (think-fast)
upstream leastgen_upstream {
    server 127.0.0.1:8756 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# LeastGen Labs Backend (leastgen-hosted, default port 8757 or 8756)
upstream leastgen_hosted_upstream {
    server 127.0.0.1:8757 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# ── 1. HTTP Server (Port 80) — Redirect All Traffic to HTTPS ─────────────────
server {
    listen 80;
    listen [::]:80;
    server_name research.example.com api.leastgen.com _;

    # Let's Encrypt / Certbot challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    # Permanent 301 redirect to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── 2. HTTPS Server (Port 443) — Production Reverse Proxy with SSL ────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name research.example.com; # Replace with your primary domain

    # ── SSL Certificates (Let's Encrypt) ──────────────────────────────────────
    ssl_certificate /etc/letsencrypt/live/research.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/research.example.com/privkey.pem;

    # Modern TLS Security (Mozilla Modern/Intermediate Recommendation)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # ── Security Headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Request limits
    client_max_body_size 50M;
    client_body_buffer_size 128k;

    # ── Gzip Compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # ── Static Frontend Assets (Aggressive Browser Caching) ───────────────────
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff2|woff)$ {
        proxy_pass http://leastgen_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 7d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # ── Auth Endpoints (5 req/min Rate Limit) ─────────────────────────────────
    location /api/auth/ {
        limit_req zone=api_auth_limit burst=5 nodelay;

        proxy_pass http://leastgen_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # ── Billing Webhooks & Checkout (10 req/min Rate Limit) ───────────────────
    location /api/billing/ {
        limit_req zone=api_billing_limit burst=5 nodelay;

        proxy_pass http://leastgen_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # ── 12-Phase Pipeline & Scoop Start (Heavy LLM & Streaming SSE) ───────────
    location ~ ^/api/(pipeline/start|scoop-check/start) {
        limit_req zone=api_pipeline_limit burst=2 nodelay;

        proxy_pass http://leastgen_upstream;
        proxy_http_version 1.1;

        # WebSocket & upgrade support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CRITICAL FOR SSE & LLM TOKEN STREAMING:
        # Disables Nginx buffering so tokens stream immediately to the client
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Long read/send timeouts for deep 12-phase pipeline runs (10 mins)
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # ── General API & SPA Catch-All ───────────────────────────────────────────
    location / {
        limit_req zone=api_general_limit burst=30 nodelay;

        proxy_pass http://leastgen_upstream;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # SSE support enabled globally
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Error handling
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

# ── 3. LeastGen Secondary HTTPS Server (Port 443 / Port 8757 Upstream) ────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.leastgen.com; # Replace with your LeastGen domain

    ssl_certificate /etc/letsencrypt/live/api.leastgen.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.leastgen.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 50M;

    # Semantic Cache Endpoint
    location /api/cache/ {
        proxy_pass http://leastgen_hosted_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Default proxy to LeastGen upstream
    location / {
        limit_req zone=api_general_limit burst=30 nodelay;
        proxy_pass http://leastgen_hosted_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 600s;
    }
}
