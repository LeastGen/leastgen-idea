# ==============================================================================
# Nginx Reverse Proxy Configuration — LeastGen Labs
# High-performance reverse proxy for FastAPI/Uvicorn with SSE & WebSocket streaming
# ==============================================================================

# Map connection upgrade header for WebSockets
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── Rate Limiting Zones ───────────────────────────────────────────────────────
# General API rate limit: 15 req/sec with burst of 30
limit_req_zone $binary_remote_addr zone=leastgen_api_zone:10m rate=15r/s;

# Auth endpoints: 5 req/min to mitigate brute-force and credential stuffing
limit_req_zone $binary_remote_addr zone=leastgen_auth_zone:10m rate=5r/m;

# Billing checkout & webhook endpoints: 10 req/min
limit_req_zone $binary_remote_addr zone=leastgen_billing_zone:10m rate=10r/m;

# Pipeline & Scoop trigger endpoints: 2 req/min (heavy LLM execution)
limit_req_zone $binary_remote_addr zone=leastgen_pipeline_zone:10m rate=2r/m;

# Cache endpoints: 20 req/s (fast read/write cache queries)
limit_req_zone $binary_remote_addr zone=leastgen_cache_zone:10m rate=20r/s;

# Custom 429 response status
limit_req_status 429;

# ── Upstream Definition ───────────────────────────────────────────────────────
upstream leastgen_backend {
    server 127.0.0.1:8756 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# ── HTTP Server (Port 80) — Redirect to HTTPS & ACME Challenge ────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.leastgen.com; # Replace with your production domain

    # Certbot / Let's Encrypt ACME verification
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS Server (Port 443) — TLS Termination & Reverse Proxy ─────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.leastgen.com; # Replace with your production domain

    # ── SSL / TLS Configuration ───────────────────────────────────────────────
    # Provided by Certbot (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/api.leastgen.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.leastgen.com/privkey.pem;

    # Modern TLS protocols and ciphers (Mozilla Modern Profile)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    # SSL session parameters for performance
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # ── Security Headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # ── Buffer & Size Settings ────────────────────────────────────────────────
    client_max_body_size 50M;
    client_body_buffer_size 128k;

    # ── Gzip Compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # ── Static Asset Caching ──────────────────────────────────────────────────
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff2|woff)$ {
        proxy_pass http://leastgen_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 7d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # ── Auth Endpoints (Rate Limited) ─────────────────────────────────────────
    location /api/auth/ {
        limit_req zone=leastgen_auth_zone burst=5 nodelay;

        proxy_pass http://leastgen_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    }

    # ── Billing Endpoints (Rate Limited) ──────────────────────────────────────
    location /api/billing/ {
        limit_req zone=leastgen_billing_zone burst=5 nodelay;

        proxy_pass http://leastgen_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    }

    # ── Semantic Cache Endpoints ──────────────────────────────────────────────
    location /api/cache/ {
        limit_req zone=leastgen_cache_zone burst=40 nodelay;

        proxy_pass http://leastgen_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    }

    # ── Pipeline & Scoop Execution (Heavy LLM & Streaming) ─────────────────────
    location ~ ^/api/(pipeline/start|scoop-check/start) {
        limit_req zone=leastgen_pipeline_zone burst=2 nodelay;

        proxy_pass http://leastgen_backend;
        proxy_http_version 1.1;

        # WebSocket & connection upgrade support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-Sent Events (SSE) & LLM Token Streaming
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Extended timeouts for research ideation (10 minutes)
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    }

    # ── General API & Single Page Application (SPA) ───────────────────────────
    location / {
        limit_req zone=leastgen_api_zone burst=30 nodelay;

        proxy_pass http://leastgen_backend;
        proxy_http_version 1.1;

        # WebSocket & connection upgrade support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Server-Sent Events (SSE) support for streaming endpoints
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Timeouts for background jobs and queries
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # ── Error Pages ───────────────────────────────────────────────────────────
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
